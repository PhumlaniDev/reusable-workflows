---
name: Discord Notification

on:
  workflow_call:
    inputs:
      status:
        description: success, failure or cancelled. Picks the embed colour when no colour is given.
        required: true
        type: string
      title:
        required: true
        type: string
      description:
        required: true
        type: string
      color:
        description: Decimal embed colour. Leave empty to derive it from status.
        required: false
        type: string
        default: ""
    secrets:
      DISCORD_WEBHOOK:
        required: true

permissions: {}

jobs:
  send-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_STATUS: ${{ inputs.status }}
      DISCORD_TITLE: ${{ inputs.title }}
      DISCORD_DESCRIPTION: ${{ inputs.description }}
      DISCORD_COLOR: ${{ inputs.color }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Send Discord notification
        run: |
          set -euo pipefail

          color="$DISCORD_COLOR"
          if [ -z "$color" ]; then
            case "$DISCORD_STATUS" in
              success)   color=3066993 ;;   # green
              failure)   color=15158332 ;;  # red
              cancelled) color=9807270 ;;   # grey
              *)         color=7506394 ;;   # blue
            esac
          fi

          # Discord limits: title 256 chars, description 4096 chars.
          payload=$(jq -n \
            --arg title "$DISCORD_TITLE" \
            --arg description "$DISCORD_DESCRIPTION" \
            --arg color "$color" \
            --arg repo "$REPOSITORY" \
            --arg url "$RUN_URL" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: ($title | .[0:256]),
                url: $url,
                description: ($description | .[0:4096]),
                color: ($color | tonumber),
                footer: { text: "Repository: \($repo)" },
                timestamp: (now | floor | todate)
              }]
            }')

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK"
