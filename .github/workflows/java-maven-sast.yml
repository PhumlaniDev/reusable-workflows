---
name: Static Code Analysis (SAST)

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_URL:
        required: true
      SONAR_PROJECT_KEY:
        required: true
      SONAR_ORGANIZATION:
        required: true

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # No build needed: CodeQL reads the sources and resolves dependencies itself.
          # Switch to "manual" and add an `mvn -B -ntp package -DskipTests` step
          # if you need full compiled-code analysis.
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Sonar needs full history for blame and new-code detection
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # Covers ~/.m2/repository, no second Maven cache needed

      - name: Cache Sonar packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download Maven target
        uses: actions/download-artifact@v7
        with:
          name: maven-target
          path: target

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Read by the scanner, keeps it off the command line
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"

  spotbugs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Run SpotBugs with FindSecBugs
        uses: jmservera/spotbugs-github-action@v0.1.0-alpha
        with:
          target: ./target/classes
          dependenciesPath: ~/.m2
          basePath: src/main/java
          output: spotbugs.sarif

      - name: Upload SpotBugs SARIF
        if: always() && hashFiles('spotbugs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: spotbugs.sarif
          category: spotbugs

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep # returntocorp/semgrep is the old, deprecated name
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Semgrep
        # Non-blocking, like the original `|| true`, but the SARIF is now uploaded.
        # Remove continue-on-error to make findings fail the pipeline.
        continue-on-error: true
        env:
          SEMGREP_RULES: p/security-audit p/owasp-top-ten
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep ci --sarif -o results.sarif

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: semgrep
