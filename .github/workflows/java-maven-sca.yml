---
name: Dependency Scanning (SCA)

on:
  workflow_call:
    inputs:
      image_tag:
        description: Tag of the image to scan (the image_tag output of the docker workflow)
        required: true
        type: string
      project_name:
        description: Image name on Docker Hub. Defaults to the repository name.
        required: false
        type: string
        default: ""
    secrets:
      SNYK_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Pin to a release tag or commit SHA instead of @master once you pick a version.
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk
        # Findings should not stop the SARIF upload below.
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to code scanning
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk

  vulnerability_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.project_name || github.event.repository.name }}:${{ inputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "0" # Report only. Set to "1" to fail the pipeline on findings.
        continue-on-error: true

      - name: Upload Trivy SARIF report to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
