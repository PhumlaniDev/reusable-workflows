---
name: Docker Build & Push

on:
  workflow_call:
    inputs:
      project_name:
        description: Image name on Docker Hub. Defaults to the repository name.
        required: false
        type: string
        default: ""
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile. Defaults to <context>/Dockerfile.
        required: false
        type: string
        default: ""
      target:
        description: Dockerfile stage to build (for example "ci" to package the prebuilt jar). Empty builds the last stage.
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
    outputs:
      image_tag:
        description: Tag of the pushed image (not the full reference, which would contain a secret)
        value: ${{ jobs.docker.outputs.image_tag }}

# Docker Hub does not need packages: write. Only checkout and artifact download.
permissions:
  contents: read
  actions: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Maven target
        uses: actions/download-artifact@v7
        with:
          name: maven-target
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.project_name || github.event.repository.name }}
          tags: |
            type=raw,value=${{ github.run_number }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Set both to true if you want SLSA provenance and an SBOM attached.
          provenance: false
          sbom: false
